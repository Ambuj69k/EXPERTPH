# Serves the built SPA and forwards /api to the API container (same origin: no CORS needed).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;   # prescription uploads (API enforces its own limit)
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz { access_log off; return 200 "ok"; }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # the service worker and index must never be cached, or clients keep an old app after an upgrade
    location = /sw.js     { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/     { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    location / { try_files $uri /index.html; }
}
