name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata                 # business dates are IST; keep test "today" in step with the server
      PHARMA_TEST_SQL: localhost
      PHARMA_TEST_SQL_AUTH: "User Id=sa;Password=Ci-Only-Passw0rd!"
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Only-Passw0rd!"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Only-Passw0rd!' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ hashFiles('backend/**/*.csproj') }}
      - name: Build
        run: dotnet build backend/PharmaOS.sln -c Release
      - name: Integration tests (real SQL Server)
        run: dotnet test backend/PharmaOS.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/tests/**/TestResults/*.trx

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit (fail on high)
        run: npm audit --audit-level=high
      - name: Type check and production build
        run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build container images (not pushed)
        run: |
          docker build -t pharmaos-api:ci ./backend
          docker build -t pharmaos-web:ci ./frontend
