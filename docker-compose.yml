# PharmaOS — single-server deployment: SQL Server + API + web (nginx).
# 1) cp .env.example .env and fill every value   2) docker compose up -d --build
# Put a TLS-terminating proxy (Caddy, Nginx, cloud load balancer) in front of port WEB_PORT for HTTPS.
name: pharmaos

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Express}          # Express is free (10 GB per database); check licensing before using another edition
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
    volumes:
      - sqldata:/var/opt/mssql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Pharma: "Server=db;Database=${SQL_DATABASE:-PharmaOS};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env (64+ random characters)}
      Platform__BootstrapEmail: ${PLATFORM_ADMIN_EMAIL:-}
      Platform__BootstrapPassword: ${PLATFORM_ADMIN_PASSWORD:-}
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-true}
      RateLimit__AuthPerMinute: ${AUTH_RATE_LIMIT:-10}
    volumes:
      - appdata:/data              # MFA key ring + uploaded prescriptions: back up together with the database
    expose:
      - "8080"                     # only reachable from the web container

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  sqldata:
  appdata:
